[package]
name = "relief-core"
version = "0.2.0"
edition = "2024"
description = "Offline millimeter geometry and print exports for Relief Studio"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "relief-native"
path = "src/main.rs"

[dependencies]
manifold-csg = { version = "=0.4.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = { version = "0.25", default-features = false }
resvg = { version = "0.45", default-features = false, features = ["text"] }
roxmltree = "0.20"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }


[[bin]]
name = "relief-web"
path = "src/web.rs"
