[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "relief-studio"
version = "0.1.0"
description = "Local image-to-relief tools for two-color wall art and puzzles"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2,<3", "shapely>=2.1,<3", "trimesh>=4.6,<6",
  "manifold3d>=3,<4", "pillow>=11,<13",
  "opencv-python-headless>=4.11,<5", "cairosvg>=2.8,<3",
  "defusedxml>=0.7,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "build>=1,<2", "scipy>=1.15,<2", "lxml>=5,<7", "networkx>=3,<4", "supervisor==4.3.0"]

[project.scripts]
relief = "relief_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
relief_studio = ["assets/*.svg", "static/**/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
